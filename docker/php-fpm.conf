; PHP-FPM pool configuration for production

[www]
user = www-data
group = www-data

; Use Unix socket (faster than TCP for same-server Nginx)
listen = /var/run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Dynamic process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
; Recycle workers to prevent memory leaks
pm.max_requests = 500

; Pass environment variables to PHP workers (required for Laravel .env reading)
clear_env = no

; Logging
access.log = /dev/stdout
catch_workers_output = yes
